# XcodeGen spec for the iOS app. Generate with:  xcodegen generate --spec ios/project.yml
#
# Site blocking (no Family Controls, so no special Apple approval — ships to TestFlight directly):
#  - Sites: a Safari Content Blocker extension fed a regenerated rule JSON via an App Group.
#  - The app owns the domain lists (each with an allow schedule: days + optional time window + Face-ID
#    gating, mirroring macOS) and rewrites the ruleset (SiteRuleset) for the *current moment*. A
#    Safari content blocker is static, so the app re-evaluates and rebuilds on every wake — launch,
#    foreground, a timer while open, and Background App Refresh — meaning a schedule boundary takes
#    effect the next time the app runs, not to the minute in the background. (Exact-time background
#    enforcement would need the DeviceActivity/Family Controls path this build deliberately avoids.)
# `ios/Shared` (rule model + ruleset builder) compiles into the app; `RulesEngine` (HostPattern) is
# shared with macOS.
name: SiteBlockerMobile
options:
  bundleIdPrefix: com.pauljohnson.siteblocker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  RulesEngine:
    path: ../RulesEngine

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  SiteBlockerMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: RulesEngine
      - target: ContentBlocker
        embed: true
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # Reference the build settings (not a baked literal) so `just ios-release`'s timestamp
        # CURRENT_PROJECT_VERSION override flows into CFBundleVersion — TestFlight needs each upload's
        # build number to increase. The app and its extension must carry the *same* version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No custom/proprietary encryption — declares this up front so TestFlight/App Store
        # doesn't ask the export-compliance question on every single upload.
        ITSAppUsesNonExemptEncryption: false
        # actool only writes CFBundleIconName nested under CFBundleIcons here, but App Store upload
        # validation checks the *top-level* key — set it explicitly so uploads pass.
        CFBundleIconName: AppIcon
        # Best-effort background rebuilds of the (static) Safari ruleset so a schedule boundary can
        # take effect while the app is closed. `fetch` enables BGAppRefreshTask; the identifier must
        # be listed here or BGTaskScheduler.register traps. Foreground is still the reliable path.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.pauljohnson.siteblocker.ios.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pauljohnson.siteblocker.ios
        CODE_SIGN_ENTITLEMENTS: App/SiteBlocker.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Names the AppIcon set in Assets.xcassets; also makes actool emit CFBundleIconName, which
        # App Store upload validation requires (else: "Missing Info.plist value CFBundleIconName").
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: ContentBlocker
    info:
      path: ContentBlocker/Info.plist
      properties:
        CFBundleDisplayName: SiteBlocker Sites
        # Must match the host app's version (App Store rejects a mismatch).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pauljohnson.siteblocker.ios.ContentBlocker
        CODE_SIGN_ENTITLEMENTS: ContentBlocker/ContentBlocker.entitlements

  # Fast logic tests for the blocking rules. No test host: it compiles the rule model straight in
  # and exercises the shared BlockEngine, so `just ios-test` runs it headlessly on a simulator.
  SiteBlockerMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/MobileRule.swift
    dependencies:
      - package: RulesEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pauljohnson.siteblocker.ios.tests
        GENERATE_INFOPLIST_FILE: YES
