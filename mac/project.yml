# XcodeGen spec. Generate the (gitignored) .xcodeproj with:  xcodegen generate --spec mac/project.yml
# Keeping the project as a diffable YAML spec plays nicely with jj (no giant pbxproj blob).
name: SiteBlocker
options:
  bundleIdPrefix: com.pauljohnson.siteblocker
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  RulesEngine:
    path: ../RulesEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Interpolated from the environment at `xcodegen generate` time (justfile loads .env).
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    # Bump on any change that must reload the *system extension*: the OS only swaps in a new
    # extension binary when its version increases. App + extension stay in lockstep.
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "14"

targets:
  SiteBlocker:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: RulesEngine
      - package: Sparkle
      - target: FilterExtension
        embed: true
        codeSign: true
    # XcodeGen generates App/Info.plist (gitignored), injecting CFBundleIdentifier etc. from build
    # settings and merging these custom keys. A hand-written plist missing CFBundleIdentifier builds
    # fine but fails `xcodebuild archive` with "Archive Missing Bundle Identifier".
    info:
      path: App/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSSystemExtensionUsageDescription: SiteBlocker uses a content filter to block distracting sites according to your rules.
        NSAppleEventsUsageDescription: SiteBlocker closes browser tabs of sites that are currently blocked.
        # Menu-bar / agent app: no Dock icon, no default window at launch.
        LSUIElement: true
        # Bump to force the OS to reload the system extension (see settings.base).
        CFBundleShortVersionString: "2.3"
        CFBundleVersion: "14"
        # Sparkle auto-update (see RELEASE.md "Auto-update"). Feed is the appcast.xml committed at
        # repo root, served unauthenticated via raw.githubusercontent.com since the repo is public.
        SUFeedURL: https://raw.githubusercontent.com/pj/site-blocker/main/appcast.xml
        # EdDSA public key generated by Sparkle's `generate_keys`; the matching private key lives
        # only in this build machine's login keychain and signs each release (see `just release`).
        SUPublicEDKey: UKJq6MtkqySGAl4mrqYpAdIdI2ZsrZI3/DPXGJT6N9s=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pauljohnson.siteblocker.app
        CODE_SIGN_ENTITLEMENTS: App/SiteBlocker.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Build directly against a manually-created Developer ID (distribution) profile — the only
        # kind that carries content-filter-provider-systemextension. Dev profiles can't, so we skip
        # development signing entirely. Profile names come from .env.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        PROVISIONING_PROFILE_SPECIFIER: ${APP_PROVISIONING_PROFILE}
        # Disable Xcode 16's SwiftUI-previews "debug dylib" split. It's for in-Xcode previews and
        # trips CLI/CI builds of an app embedding an extension with a bogus `Module name ""` error.
        ENABLE_DEBUG_DYLIB: NO
        # Drives the real content filter. Remove this line to build against MockEnforcer instead.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ENABLE_NETWORK_EXTENSION

  FilterExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: FilterExtension
    dependencies:
      - package: RulesEngine
    info:
      path: FilterExtension/Info.plist
      properties:
        CFBundlePackageType: SYSX
        # The extension's version must match the app's and increase to force a reload.
        CFBundleShortVersionString: "2.3"
        CFBundleVersion: "14"
        # macOS 26 (Tahoe) requires network_extension-category system extensions to carry this in
        # their *own* Info.plist (not just the host app's), or activation fails.
        NSSystemExtensionUsageDescription: SiteBlocker uses a content filter to block distracting sites according to your rules.
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pauljohnson.siteblocker.app.FilterExtension
        # A system extension's executable (and thus its .systemextension bundle) must be named
        # exactly its bundle identifier, or OSSystemExtensionRequest fails with "Extension not found
        # in App bundle / no matched extension" — enforced strictly since macOS 26 (Tahoe). Pin the
        # Swift module name separately so `$(PRODUCT_MODULE_NAME).FilterDataProvider` in the Info
        # plist's NEProviderClasses stays `FilterExtension.FilterDataProvider`.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: FilterExtension
        CODE_SIGN_ENTITLEMENTS: FilterExtension/FilterExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        PROVISIONING_PROFILE_SPECIFIER: ${EXT_PROVISIONING_PROFILE}
